# PostgreSQL for local runs. Bound to 127.0.0.1 only; CI uses its own service container.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: showcase
      POSTGRES_PASSWORD: showcase
      POSTGRES_DB: showcase
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase -d showcase"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
