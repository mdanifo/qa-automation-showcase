[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-automation-showcase"
version = "1.0.0"
description = "A small expense app and a pytest and Playwright suite that proves it can fail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mike Danifo" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-playwright>=0.6",
    "pytest-xdist>=3.6",
    "pytest-html>=4.1",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "ruff==0.17.0",
]
# Pinned so a new ruff release cannot turn CI red with a formatting change.
lint = ["ruff==0.17.0"]

[project.urls]
Homepage = "https://danifo.dev"

[tool.setuptools]
packages = ["expenses"]

[tool.setuptools.package-data]
expenses = ["schema.sql", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
markers = [
    "catches(*bugs): this test is meant to fail when any of the named seeded bugs is active",
    "unit: pure business rules in expenses/rules.py, no server or database",
    "api: HTTP behavior and business rules through the JSON API",
    "contract: response shapes checked against contracts/*.schema.json",
    "db: what the database actually holds after an operation",
    "export: the finance CSV export",
    "ui: the browser pages, driven with Playwright",
    "smoke: checks that the shared fixtures work",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["expenses", "tests"]
