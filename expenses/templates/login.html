{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">A demo app with fictional users. Pick one; there are no passwords.</p>
{% if error %}
<div class="alert" role="alert" data-testid="form-error">{{ error }}</div>
{% endif %}
<form method="post" action="/login" class="card stack">
  <div class="field">
    <label for="user">User</label>
    <select id="user" name="user">
      {% for u in users %}
      <option value="{{ u.username }}">{{ u.display_name }} ({{ u.role }})</option>
      {% endfor %}
    </select>
  </div>
  <div><button type="submit">Sign in</button></div>
</form>
{% endblock %}
