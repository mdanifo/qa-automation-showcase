# Lint, run the suite, then prove the suite fails once per seeded bug.
# Hosted runners only: this repository is public, and a self-hosted runner
# would run code from any fork's pull request on that machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://showcase:showcase@127.0.0.1:5433/showcase

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: pip install -e ".[lint]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: showcase
          POSTGRES_PASSWORD: showcase
          POSTGRES_DB: showcase
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U showcase -d showcase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the app and the test tools
        run: pip install -e ".[test]"
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Run the suite
        run: >-
          pytest -n auto
          --junitxml=reports/junit.xml
          --html=reports/report.html --self-contained-html
          --tracing retain-on-failure
          --screenshot only-on-failure
          --video retain-on-failure
          --output test-results
      - name: Upload the report, traces, screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            test-results/
          if-no-files-found: warn

  prove-tests-fail:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: showcase
          POSTGRES_PASSWORD: showcase
          POSTGRES_DB: showcase
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U showcase -d showcase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the app and the test tools
        run: pip install -e ".[test]"
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Run the suite once per seeded bug
        # The test job has already run the clean suite, so this job runs only the bugs.
        run: python scripts/prove_tests_fail.py --skip-clean
      - name: Upload the seeded-bug table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeded-bugs
          path: reports/seeded-bugs.md
